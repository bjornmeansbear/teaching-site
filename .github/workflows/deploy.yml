# Builds the site and publishes it to GitHub Pages on every push to main.
# The build only reads the committed src/lib/data/teaching.json; it never
# talks to Notion (no token here, on purpose). Syncing stays a manual step.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

# Allow this workflow to publish to Pages, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, finish the running deploy, skip stale ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
